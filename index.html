<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anatomi Bahu 3D</title>
  <meta name="description" content="Penjelajah anatomi bahu 3D interaktif: otot, tendon, ligamen, tulang, sendi, saraf, gerakan, dan katalog cedera (edukasi)." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2314202b'/%3E%3Cpath d='M9 22c0-7 4-12 10-12 3 0 5 2 5 4' stroke='%234cc3ff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='13' r='3' fill='%23e6dcc6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-left" aria-label="Buka panel kiri">☰</button>
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <div class="brand-title">Anatomi Bahu 3D</div>
          <div class="brand-sub">Shoulder Anatomy Explorer · sisi kanan</div>
        </div>
      </div>
      <nav class="modes" id="modes" role="tablist">
        <button role="tab" data-mode="explore" class="active">Jelajah</button>
        <button role="tab" data-mode="movement">Gerakan</button>
        <button role="tab" data-mode="injury">Cedera</button>
        <button role="tab" data-mode="pain">Lokasi nyeri</button>
      </nav>
      <div class="top-actions">
        <button class="ghost-btn" id="btn-refs">Sumber</button>
        <button class="icon-btn only-mobile" id="btn-right" aria-label="Buka panel detail">ⓘ</button>
      </div>
    </header>

    <aside class="sidebar left" id="left"></aside>

    <main class="stage" id="stage">
      <canvas id="c"></canvas>
      <div class="labels" id="labels"></div>
      <div class="hover-tip" id="hover-tip"></div>

      <div class="toolbar" id="toolbar">
        <button data-act="reset" title="Reset kamera">⟲<span>Reset</span></button>
        <div class="tb-group">
          <button data-view="front" title="Tampak depan">Depan</button>
          <button data-view="back" title="Tampak belakang">Belakang</button>
          <button data-view="side" title="Tampak samping">Samping</button>
          <button data-view="top" title="Tampak atas">Atas</button>
          <button data-view="arm" title="Seluruh lengan sampai ujung jari">Lengan</button>
        </div>
        <button data-act="zoomin" title="Perbesar">＋</button>
        <button data-act="zoomout" title="Perkecil">－</button>
        <button data-act="rotate" title="Putar otomatis">↻<span>Putar</span></button>
        <button data-act="isolate" title="Isolasi struktur terpilih">◎<span>Isolasi</span></button>
        <button data-act="xray" title="Otot transparan">◐<span>X-ray</span></button>
        <button data-act="showall" title="Tampilkan semua">▣<span>Semua</span></button>
      </div>

      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Memuat model anatomi…</div>
      </div>

      <div class="legend" id="legend"></div>
    </main>

    <aside class="sidebar right" id="right"></aside>

    <footer class="bottombar" id="bottom"></footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Tutup">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
